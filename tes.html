<script>
  const form = document.getElementById('formUjiCoba');
  const btnKirim = document.getElementById('btnKirim');
  const pesanStatus = document.getElementById('pesanStatus');
  
  const scriptURL = 'https://script.google.com/macros/s/AKfycbxLjlvqSnvMfY7d689zbZVn3zSmV6tz-059bv7nAI_pSUybeXs22wCT6S1a-LTfnSes/exec';

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    
    btnKirim.disabled = true;
    btnKirim.innerText = 'Mengirim...';
    pesanStatus.style.color = 'black';
    pesanStatus.innerText = 'Sedang memproses...';

    // Kirim menggunakan URLSearchParams agar cocok dengan mode no-cors
    const data = new URLSearchParams(new FormData(form));

    fetch(scriptURL, { 
      method: 'POST', 
      mode: 'no-cors',
      headers: {
        'Content-Type': 'application/x-www-form-urlencoded'
      },
      body: data 
    })
    .then(() => {
      pesanStatus.style.color = 'green';
      pesanStatus.innerText = 'Data berhasil dikirim!';
      form.reset();
      btnKirim.disabled = false;
      btnKirim.innerText = 'Kirim Data';
    })
    .catch(error => {
      pesanStatus.style.color = 'red';
      pesanStatus.innerText = 'Gagal mengirim data. Coba lagi.';
      console.error('Error:', error);
      btnKirim.disabled = false;
      btnKirim.innerText = 'Kirim Data';
    });
  });
</script>
