<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uji Coba Form Input Baru</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; max-width: 500px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input { width: 100%; padding: 8px; box-sizing: border-box; }
    button { padding: 10px 15px; background: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; }
    button:hover { background: #0056b3; }
  </style>
</head>
<body>

  <h2>Formulir Input Data (Uji Coba)</h2>
  
  <form action="https://script.google.com/macros/s/AKfycbyGHi-U3pXVs4uKCQOb0xTyrhFC9M5u5mbBarP5Cb2w31_Ior38TGPWFNJ-0GK0rAcU/exec" method="POST">
    <div class="form-group">
      <label for="nama">Nama Lengkap:</label>
      <input type="text" id="nama" name="nama" required>
    </div>
    
    <div class="form-group">
      <label for="keterangan">Keterangan / Catatan:</label>
      <input type="text" id="keterangan" name="keterangan" required>
    </div>
    
    <button type="submit">Kirim Data</button>
  </form>

</body>
</html>
